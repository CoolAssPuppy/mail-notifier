name: MailNotifierStore
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GoogleAPIClientForREST:
    url: https://github.com/google/google-api-objectivec-client-for-rest
    from: "2.0.0"
  GTMAppAuth:
    url: https://github.com/google/GTMAppAuth
    from: "1.0.0"
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "1.4.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  MailNotifierStore:
    type: application
    platform: macOS
    sources:
      - path: ../Source
        excludes:
          - Services/EntitlementManager.swift
          - Services/LicenseProvider.swift
          - Services/PolarConfig.swift
          - Services/PolarLicenseClient.swift
          - Services/UpdaterManager.swift
          - Views/PaywallSheet.swift
          - Views/Components/SubscriptionCard.swift
      - path: Sources
      - path: ../Images.xcassets
      - path: ../Resources
    dependencies:
      - package: GoogleAPIClientForREST
        product: GoogleAPIClientForREST_Gmail
      - package: GTMAppAuth
      - package: AppAuth
      - package: KeyboardShortcuts
      - package: PostHog
      - package: Sentry
        product: Sentry
    configFiles:
      Debug: Build.xcconfig
      Release: Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.MailNotifierApp
        PRODUCT_NAME: Mail Notifier
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "39"
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAC_APP_STORE
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 955GSY56UT
        CODE_SIGN_ENTITLEMENTS: MailNotifierStore.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
    scheme: {}
