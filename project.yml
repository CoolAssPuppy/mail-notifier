name: MailNotifier
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  GoogleAPIClientForREST:
    url: https://github.com/google/google-api-objectivec-client-for-rest
    from: "2.0.0"
  GTMAppAuth:
    url: https://github.com/google/GTMAppAuth
    from: "1.0.0"
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "1.4.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 955GSY56UT
  configs:
    Debug:
      # Hardened runtime breaks XCTest's runtime injection into the host app.
      ENABLE_HARDENED_RUNTIME: NO
      # Xcode 15+ mergeable libraries split the host into "Mail Notifier" +
      # "Mail Notifier.debug.dylib" in Debug, but the test bundle's rpath
      # doesn't reach the host's MacOS directory so dlopen fails with
      # "Library not loaded: @rpath/Mail Notifier.debug.dylib". Force a
      # statically merged Debug binary so xcodebuild test works.
      MERGED_BINARY_TYPE: manual
      MERGEABLE_LIBRARY: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  MailNotifier:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - MailNotifierTests
      gatherCoverageData: true
    sources:
      - path: Source
      - path: Images.xcassets
      # Sounds ship at the bundle resource root (a plain group, not a folder
      # reference) so UNNotificationSound(named:) can find them. The notification
      # sound API does not recurse into bundle subfolders, so they cannot live in
      # a Sounds/ subdirectory of the bundle.
      - path: Resources
    dependencies:
      - package: GoogleAPIClientForREST
        product: GoogleAPIClientForREST_Gmail
      - package: GTMAppAuth
      - package: AppAuth
      - package: KeyboardShortcuts
      - package: KeychainAccess
      - package: Sparkle
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.MailNotifierApp
        PRODUCT_NAME: "Mail Notifier"
        MARKETING_VERSION: "3.6.1"
        CURRENT_PROJECT_VERSION: "30"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MailNotifier.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LS_MINIMUM_SYSTEM_VERSION: "14.0"
        COMBINE_HIDPI_IMAGES: YES
        # PostHog telemetry. The api_key is intentionally read from an env var so
        # forks and dev builds don't write into the prod project. Set it in your
        # shell (Doppler) before running `xcodegen generate` / building.
        # Telemetry.setup() silently disables capture when the key is missing.
        # It used to be hardcoded here and pointed at the Strategic Nerds Blog
        # project, which is why months of menu-bar events landed in the blog's
        # analytics instead of this app's.
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
        POSTHOG_HOST: "https://us.i.posthog.com"
        # Polar, for the paid multi-account plan. Public values, not secrets:
        # the ids are UUIDs and the URLs are meant to be shared. They come from
        # Secrets.xcconfig (scripts/pull-secrets.sh writes it from Doppler) and
        # are baked into Info.plist. Every one empty leaves the app on the free
        # tier with no paywall, which is what a fork or a dev build should see.
        POLAR_ORG_ID: "$(POLAR_ORG_ID)"
        POLAR_BENEFIT_ID: "$(POLAR_BENEFIT_ID)"
        POLAR_CHECKOUT_URL: "$(POLAR_CHECKOUT_URL)"
        POLAR_PORTAL_URL: "$(POLAR_PORTAL_URL)"
        POLAR_API_BASE: "$(POLAR_API_BASE)"
  MailNotifierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MailNotifier
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mail Notifier.app/Contents/MacOS/Mail Notifier"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.MailNotifierTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Hardened runtime breaks XCTest's runtime injection into the host
        # app during `xcodebuild test`. Disable for the test bundle only.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
